name: Shared capture workflow smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate-product:
    uses: grafanaKibana/product-captures/.github/workflows/validate.yml@73adb770fb9f6ff065ff39280be69393de60835e
    with:
      config: product-captures.json
  capture-generic:
    uses: grafanaKibana/product-captures/.github/workflows/capture.yml@73adb770fb9f6ff065ff39280be69393de60835e
    with:
      config: docs/capture-smoke/product-captures.json
      dry-run: false
      capture-mode: fresh
      release-tag: ''
      update-pr: false
