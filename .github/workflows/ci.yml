name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/version.mjs --next "$PR_TITLE"

  version:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      increased: ${{ steps.version.outputs.increased }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git show "$BASE_SHA:package-lock.json" > "$RUNNER_TEMP/package-lock.base.json"
          result=$(node scripts/version.mjs --check "$RUNNER_TEMP/package-lock.base.json")
          if [[ "$EVENT_NAME" == "pull_request" && "$result" == *"increased=true"* ]]; then
            echo "::error::Version metadata is updated automatically after merge."
            exit 1
          fi
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

  upstream-parity:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OBSIDIAN_TABSDOWN_SHA: bd65bfa8adf800978ebaa32092619aa604576520
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - if: github.event_name != 'schedule'
        run: npm run check:upstream -- "$OBSIDIAN_TABSDOWN_SHA"
      - if: github.event_name == 'schedule'
        run: npm run check:upstream

  quartz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Quartz clones plugins from a remote, so this checks the pushed ref
      # rather than the checkout.
      - run: ./scripts/quartz-smoke.sh "github:${{ github.repository }}#${{ github.head_ref || github.ref_name }}"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run format --if-present
      - run: npm run test --if-present
      - run: npm run build
      - name: Verify dist externals
        run: |
          node -e "
          const fs = require('fs');
          const dist = 'dist/index.js';
          if (!fs.existsSync(dist)) process.exit(0);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
          const peerDeps = Object.keys(pkg.peerDependencies || {});
          const builtins = new Set(['assert','buffer','child_process','cluster','console','constants','crypto','dgram','dns','domain','events','fs','http','http2','https','inspector','module','net','os','path','perf_hooks','process','punycode','querystring','readline','repl','stream','string_decoder','sys','timers','tls','trace_events','tty','url','util','v8','vm','wasi','worker_threads','zlib']);
          const shared = ['@quartz-community/','preact','@jackyzha0/quartz','vfile','unified'];
          const content = fs.readFileSync(dist, 'utf-8');
          const re = /^\s*(?:import\s+.*\s+from|export\s+.*\s+from)\s+[\"']([^\"'./][^\"']*)[\"']/gm;
          const unexpected = new Set();
          for (const m of content.matchAll(re)) {
            const s = m[1];
            if (s.startsWith('node:')) continue;
            const bare = s.includes('/') && s.startsWith('@') ? s.split('/').slice(0,2).join('/') : s.split('/')[0];
            if (builtins.has(bare)) continue;
            if (shared.some(p => s.startsWith(p))) continue;
            if (peerDeps.some(d => s === d || s.startsWith(d + '/'))) continue;
            unexpected.add(s);
          }
          if (unexpected.size > 0) {
            console.error('ERROR: dist/ has unbundled external imports that will fail at runtime:');
            for (const u of unexpected) console.error('  - ' + u);
            console.error('Move these from dependencies to devDependencies so tsup bundles them.');
            process.exit(1);
          }
          console.log('dist/ externals verified: all imports are bundled or allowlisted.');
          "

  release:
    if: github.event_name == 'push'
    needs: [version, upstream-parity, quartz-smoke, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version commit and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_VERSION: ${{ needs.version.outputs.version }}
          VERSION_INCREASED: ${{ needs.version.outputs.increased }}
        run: |
          set -euo pipefail

          version="$CURRENT_VERSION"
          automated=false
          if [[ "$VERSION_INCREASED" != "true" ]]; then
            title=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .title // empty')
            if [[ -z "$title" ]]; then
              echo "::error::The main commit is not associated with a merged pull request."
              exit 1
            fi
            version=$(node scripts/version.mjs --next "$title")
            automated=true
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            gh release create "$version" --verify-tag --generate-notes --latest
            exit 0
          fi

          if [[ "$automated" == "true" ]]; then
            npm run version -- "$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: release $version [skip ci]"
          fi

          git tag "$version"
          if [[ "$automated" == "true" ]]; then
            git push --atomic origin HEAD:main "refs/tags/$version"
          else
            git push origin "refs/tags/$version"
          fi
          gh release create "$version" --verify-tag --generate-notes --latest
